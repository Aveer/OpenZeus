name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run test suite
        run: OPENZEUS_NODE="$(command -v node)" npm test

      - name: Test V2 plugin entrypoint
        run: node tests/plugin.mjs

      - name: Validate package assets
        run: ./bin/openzeus validate --ci

      - name: Validate agent bootstrap
        shell: bash
        run: |
          set -euo pipefail
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/openzeus-config"
          ./bin/openzeus install-agent
          cmp agents/OpenZeus.md "$OPENCODE_CONFIG_DIR/agents/OpenZeus.md"

      - name: Verify npm package contents
        run: npm pack --dry-run
